global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'delivery-service'
    environment: 'development'

scrape_configs:
  # User Service
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8001']
        labels:
          service: 'user-service'
          service_type: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
  
  # Catalog Service
  - job_name: 'catalog-service'
    static_configs:
      - targets: ['catalog-service:8002']
        labels:
          service: 'catalog-service'
          service_type: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
  
  # Order Service
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8003']
        labels:
          service: 'order-service'
          service_type: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
  
  # Payment Service
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8004']
        labels:
          service: 'payment-service'
          service_type: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
  
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          service_type: 'monitoring'